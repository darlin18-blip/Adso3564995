<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01-Emeettitle>
        <link rel="stylesheet" href="../master.css">
</head>

<body class="emmet">
    <nav class="goback">
        <a href="../index.html">
            HOME
        </a>
    </nav>
    <Main>
        <HEADER class="mmenu">
            <H1>01-Emeet</H1>
            <H2>TGO plugin for faster HTML and CSS coding.</H2>
            <img src="src/images/noche.webp" alt="My profile">
        </HEADER>
        <section>
            <h2 class="subtitle">
                01-child
                <span> > </span>
            </h2> 
            <small> creates child elements (nesting).</small>
            <h3>Example: </h3>       
            <p><ul>li>a ↔️</p>
            <h3>Result: </h3>
<xmp><ul>
    <li>
        <a href=""></a>
    </li>
</ul></xmp>
        </section>
        

     <section>
            <h2 class="subtitle">
                02-Sibling
                <span> > </span>
            </h2> 
            <small> creates sibling elements .</small>
            <h3>Example: </h3>       
            <p>header+section+footer ↔️</p>
            <h3>Result: </h3>
<xmp><header></header>
    <section></section>
    <footer></footer></xmp>
            </section> 

    <li>
        <a href=""><</a>
    </li>
</ul></xmp>
        </section>

          <section>
            <h2 class="subtitle">
                03-multiplication
                <span> * </span>
            </h2> 
            <small> creates sibling multiple times .</small>
            <h3>Example: </h3>       
            <p><ul>li*3 ↔️</p>
            <h3>Result: </h3>
<xmp><ul>
    <li></li>
    <li></li>
    <li></li>
</ul></xmp>    

            </section> 

             <section>
            <h2 class="subtitle">
                04-class
                <span> . </span>
            </h2> 
            <small> creaters a class atribute .</small>
            <h3>Example: </h3>       
            <p>div.importan ↔️</p>
            <p>div.danger ↔️</p>
            <h3>Result: </h3>
<xmp><div class="important"></div>
<div class="danger"></div></xmp>       

            </section>

            <section>
            <h2 class="subtitle">
                05-Classes
                <span> ... </span>
            </h2> 
            <small> creates  multiple class attributes .</small>
            <h3>Example: </h3>       
            <p>div.red.green.blue ↔️</p>
            <h3>Result: </h3>
<xmp><div class="red green blue"></div></xmp>   

            </section> 

             <section>
            <h2 class="subtitle">
                06-Identification
                <span> # </span>
            </h2> 
            <small> creates an ID attribute .</small>
            <h3>Example: </h3>       
            <p>menu#cod123 ↔️</p>
            <h3>Result: </h3>
<xmp><menu id="codi123"></menu></xmp>

            </section> 

             <section>
            <h2 class="subtitle">
                07-tex
                <span>  {} </span>
            </h2> 
            <small> Inserts text content .</small>
            <h3>Example: </h3>       
            <p>p{lorem ipsum dolor} ↔️</p>
            <p>a{Click Here} ↔️</p>
            <h3>Result: </h3>
<xmp><p>lorem ipsum dolor</p>
<a href="">Click Here</a></xmp>    

            </section> 

             <section>
            <h2 class="subtitle">
                08-custom Attributes
                <span>  [] </span>
            </h2> 
            <small> Inserts text content .</small>
            <h3>Example: </h3>       
            <p>input[type=number] ↔️</p>
            <p>a{Click Here} ↔️</p>
            <h3>Result: </h3>
<xmp><input type="number"></xmp> 

            </section>

             <section>
            <h2 class="subtitle">
                09-Item Numbering
                <span>  $ </span>
            </h2> 
            <small> Adds consecutive numbers .</small>
            <h3>Example: </h3>       
            <p><ul>li.option$$*3 ↔️</p>
            <h3>Result: </h3>
<xmp><ul>
    <li class="option01"></li>
    <li class="option02"></li>
    <li class="option03"></li>
</ul></xmp>    

            </section> 
            <section>
            <h2 class="subtitle">
                10-Reverse Numering
                <span> @ </span>
            </h2> 
            <small> Inverts numbering order .</small>
            <h3>Example: </h3>       
            <p><ul>li.num$@-*3 ↔️</p>
            <h3>Result: </h3>
<xmp><ul
    <li class="num3"></li>
    <li class="num2"></li>
    <li class="num2"></li>
    <ul><xmp>


            </section>

            <section>
            <h2 class="subtitle">
                11-Base Numering
                <span> > @n </span>
            </h2> 
            <small> Defines a base number for sequences .</small>
            <h3>Example: </h3>       
            <p><ul>li.num$@3*4 ↔️</p>
            <h3>Result: </h3>
<xmp><ul>
    <li class="num3"></li>
    <li class="num3"></li>
    <li class="num3"></li>
    <li class="num3"></li>
    
    
</ul></xmp>    

            </section> 

             <section>
            <h2 class="subtitle">
                12-Clim up
                <span>  ^ </span>
            </h2> 
            <small> Moves up one level .</small>
            <h3>Example: </h3>       
            <p><ul>section>article>div^p ↔️</p>
            <h3>Result: </h3>
<xmp><section>
   <article>
<div></div>
</article>
<p></p>
   

            </section> 
            
             <section>
            <h2 class="subtitle">
                13-grouping
                <span>  () </span>
            </h2> 
            <small> groups elements together .</small>
            <h3>Example: </h3>       
            <p>(header>nav) ↔️</p>
            <p>(section>articicle)</p>
            <h3>Result: </h3>
<xmp><header>
    <nav></nav>
    </header>
    <section>
        <articicle></articicle>
        </section>
        </xmp>

    </section>

      </section> 
            
             <section>
            <h2 class="subtitle">
                14-lorem
                <span> lorem </span>
            </h2> 
            <small> generates placeholder text .</small>
            <h3>Example: </h3>       
            <p>lorem ↔️</p>
            <p>lorem20</p>
            <p>lorem*5</p>
            <h3>Result: </h3>
<xmp>lorem
        </xmp>


            </section>
             <section>
            <h2 class="subtitle">
               15-HTML
                <span> HTML </span>
            </h2>
            <small>Creates various HTML document types.</small>
            <h3>Example</h3>
            <p> html:xs ↔️</p>
            <p> html:xt ↔️</p>
            <p> html:4s ↔️</p>
            <p> html:4t ↔️</p>
            <p> html:5 ↔️</p>
            <h3>Result</h3>
<xmp><html:xs></html:xs>
    <html:xt></html:xt>
    <html:4s></html:4s>
    <html:4t></html:4t>
    html:5
</xmp>
        </section>
        <section>
            <h2 class="subtitle">
               16-Meta tags
                <span style="font-size: 0.5rem;"> meta</span>
            </h2>
            <small>Generates meta tags.</small>
            <h3>Example</h3>
            <p> meta:vp ↔️</p>
            <h3>Result</h3>
<xmp><meta name="viewport" content="width=device-width, 
    initial-scale=1.0">
</xmp>
        </section>
         <section>
            <h2 class="subtitle">
               17-challenge

                </div>
            </div>
        </nav>
    </header>
</xmp>
        </section>
    
        </menu>
    </Main>
    
    
       
</body>

</html>
