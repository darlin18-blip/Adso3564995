<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>45-challenge-grid</title>
    <link rel="stylesheet" href="../master.css">
<style>
        section {
            h3.gallery01{
                display: none;
            }
            div.gallery {
            display: grid;
            grid-template-areas: "one two three"
                                 "four two five"
                                 "six six seven";
            grid-template-columns: 100px 1fr;
            grid-template-rows: auto;
            grid-gap: 0.2rem;

            div {
                width: 100px;
                height: 100px;
                background-color: red;
                margin: 0.2 auto;
            
            &:first-child {
            background: url(imgs/pucca7.jpg) no-repeat center / cover;
            grid-area: one;
            
            }
            &:nth-child(2) {
            grid-area: two;
            background: url(imgs/pucca3.jpg)no-repeat center / cover;
            height: calc(200px + 0.2rem);
            width: 150px;
            }
           &:nth-child(3) {
            grid-area: three;
            background: url(imgs/pucca2.png)no-repeat center / cover;
            }
            &:nth-child(4) {
            background: url(imgs/pucca5.jpg)no-repeat center / cover;
            grid-area: four;
            }
            &:nth-child(5) {
            grid-area: five;
            background: url(imgs/pucca1.png)no-repeat center / cover;
            }
            &:nth-child(6) {
            grid-area: six;
            background: url(imgs/Pucca6.png)no-repeat center / cover ;
            width: calc(250px + 0.2rem);

            }
            &:last-child {
            grid-area: seven;
            background: url(imgs/pucca4.jpg)no-repeat center / cover;
            }
        }
    }
     div.gallery02 {
            display: grid;
            grid-template-areas: "one one two three"
                                 "one one four four"
                                 "five six four four";
            grid-template-columns: 87px 87px 87px 87px;
            grid-template-rows: 87px 87px 87px;
            grid-gap: 0.2rem;   
            width: 400px;
            height: 280px;

            div {
                width: 100%;
                height: 100%;
                background-color: red;
                margin: 0.3 auto;
                 &:first-child {
            background: url(imgs/hada3.jpg) no-repeat center / cover;
            grid-area: one;
            
            }
            &:nth-child(2) {
            grid-area: two;
            background: url(imgs/hada1.jpg)no-repeat center / cover;
           
            }
           &:nth-child(3) {
            grid-area: three;
            background: url(imgs/hada4.jpg)no-repeat center / cover;
            }
            &:nth-child(4) {
            background: url(imgs/hada5.jpg)no-repeat center / cover;
            grid-area: four;
           

            }
            &:nth-child(5) {
            grid-area: five;
            background: url(imgs/hada2.jpg)no-repeat center / cover;
            }
            &:last-child {
            grid-area: six;
            background: url(imgs/hada6.jpg)no-repeat center / cover ;
           
            }
            }
        }
} 

     
    </style>
</head>
