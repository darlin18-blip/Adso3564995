<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>32-clip-path</title>
    <link rel="stylesheet" href="../master.css">
    <style>
        section {
            div.clip {
                background: url(imgs/pittsburgh.jpg)
                            no-repeat center / cover;
                margin: 2rem auto;             
                height: 200px;
                width: 340px;
                transition: all 0.5s ease;

                &.clip1 {
                    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);


                    &:hover {
                        clip-path: polygon(50% 0%, 100% 1%, 100% 35%, 100% 64%, 100% 100%, 61% 100%, 0 100%, 0 64%, 0 35%, 0 0);

                    }
                }

                &.clip2 {
                    clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);

                    &:hover {
                        clip-path: polygon(0 0, 100% 0, 100% 30%, 100% 70%, 100% 100%, 0 100%, 0% 70%, 0% 30%);
                    }

                }

                &.clip3 {
                   clip-path: polygon(20% 0%, 0% 20%, 30% 50%, 0% 80%, 20% 100%, 50% 70%, 80% 100%, 100% 80%, 70% 50%, 100% 20%, 80% 0%, 50% 30%);

                   &:hover {
                    clip-path: polygon(0 0, 0% 20%, 0 54%, 0% 80%, 0 100%, 55% 100%, 100% 100%, 100% 80%, 100% 59%, 100% 20%, 100% 0, 48% 0);
                   }
                }
            }
        }
    </style>
</head>
<body class="css">
    <nav class="goback">
        <a href="index.html">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
                    </svg>
                </path>
            </svg>
        </a>
    </nav>
    <main>
        <header class="mmenu internal">
            <h1>32-clip-path</h1>
            <img src="../src/images/logo-css.png" alt="css">
            <h3>Property lets you clip an element to a basic shape.</h3>
        </header>
        <section>
            <h3 class="subtitle">Example 01:</h3>
            <div class="clip clip1"></div>
            <h3 class="subtitle">Example 02:</h3>
            <div class="clip clip2"></div>
            <h3 class="subtitle">Example 03:</h3>
            <div class="clip clip3"></div>
        </section>
    </main>
</body>
</html>
