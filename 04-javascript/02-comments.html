    <main>

         <h1>02-comments</h1>

         <h3>Add comments to explain or annotate your code.</h3>
        </header>
        <section>
                <h3 class="subtitle">Digital Time:</h3>
                <p id="time">00:00:00</p>
        </section>
    </main>
    <script>
        // this is a comment line (only one line)
        //Elements
        const time = document.gerElementById('time');

        /*
        this is a multiple lines comment,
        is used for explain something or
        inactive portion of code.
        */

        //Apply some styles
        time.style.zoom      = '4'; // increase size 400%
        time.style.textAling = 'center'; // text in center

        // Interval Time (1s)
           setInterval(function(){
                const now = new Date;
                time.textContent = `${now.getHours()}:
                                    ${now.getMinutes()}:
                                    ${now.getSeconds()}`
            },1000); // 1 second squals 1000 ms
        
    </script>
